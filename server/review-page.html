<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HC-AIDW 审核页</title>
<style>
  :root { --ink:#1a2332; --muted:#5a6a7e; --line:#dde4ec; --bg:#f6f8fb; --card:#fff;
          --green:#0a7d4f; --green-bg:#e8f5ee; --amber:#b45309; --amber-bg:#fdf3e3;
          --red:#b3251e; --red-bg:#fdecea; --blue:#0b5cad; --blue-bg:#e8f1fa; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
         color:var(--ink); background:var(--bg); line-height:1.7; font-size:15px; }
  .wrap { max-width:900px; margin:0 auto; padding:28px 20px 80px; }
  h1 { font-size:23px; margin:0 0 4px; }
  .meta { color:var(--muted); font-size:13px; }
  .pill { display:inline-block; padding:2px 12px; border-radius:20px; font-size:13px; font-weight:600; }
  .p-wait { background:var(--amber-bg); color:var(--amber); }
  .p-ok { background:var(--green-bg); color:var(--green); }
  h2 { font-size:18px; margin:30px 0 4px; border-left:4px solid var(--blue); padding-left:10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 18px; margin:10px 0; }
  .hl { border-left:4px solid var(--green); }
  .banner { background:var(--blue-bg); border:1px solid var(--blue); border-radius:10px; padding:12px 16px; margin:14px 0; }
  .banner ul { margin:6px 0 0; padding-left:20px; }
  .tag { display:inline-block; font-size:12.5px; padding:1px 10px; border-radius:14px; margin:2px 8px 2px 0; }
  .t-green { background:var(--green-bg); color:var(--green); }
  .t-amber { background:var(--amber-bg); color:var(--amber); }
  .actor { flex:1; min-width:220px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin:8px 0; }
  .lane { display:flex; gap:10px; margin:8px 0; align-items:stretch; }
  .who { flex:0 0 56px; display:flex; align-items:center; justify-content:center; border-radius:8px; font-weight:600; font-size:13px; }
  .wt { background:var(--blue-bg); color:var(--blue); }
  .ws { background:var(--green-bg); color:var(--green); }
  .steps { display:flex; flex:1; gap:8px; flex-wrap:wrap; }
  .step2 { flex:1; min-width:130px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:7px 11px; font-size:13px; }
  .step2 b { display:block; }
  .q { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 16px; margin:10px 0; }
  .q .opts { margin-top:6px; }
  .q label { margin-right:18px; cursor:pointer; }
  .rec { color:var(--green); font-weight:600; }
  textarea { width:100%; min-height:52px; margin-top:8px; border:1px solid var(--line);
             border-radius:8px; padding:8px 10px; font-family:inherit; font-size:13.5px; resize:vertical; }
  button { padding:8px 22px; border-radius:8px; border:1.5px solid var(--blue);
           background:var(--card); color:var(--blue); font-size:14px; cursor:pointer; font-family:inherit; }
  button.pri { background:var(--blue); color:#fff; }
  button.ok { border-color:var(--green); background:var(--green); color:#fff; }
  button:disabled { opacity:.45; cursor:default; }
  .msg { margin-top:8px; font-size:13.5px; }
  .m-ok { color:var(--green); } .m-err { color:var(--red); } .m-info { color:var(--blue); }
  details { margin:10px 0; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 16px; }
  summary { cursor:pointer; color:var(--blue); font-size:13.5px; }
  pre { background:#f2f5f9; padding:10px; border-radius:8px; font-size:12px; overflow:auto; white-space:pre-wrap; }
  .fbitem { border-top:1px dashed var(--line); padding:8px 2px; font-size:13.5px; }
  .fbitem .st { font-size:12px; padding:1px 8px; border-radius:12px; margin-left:6px; }
  .st-pending { background:var(--amber-bg); color:var(--amber); }
  .st-addressed { background:var(--green-bg); color:var(--green); }
  #live { position:fixed; right:16px; bottom:12px; font-size:12.5px; color:var(--muted);
          background:var(--card); border:1px solid var(--line); border-radius:20px;
          padding:4px 14px; box-shadow:0 1px 4px rgba(0,0,0,.06); z-index:9; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="card" id="boot">加载审核任务中…</div>
</div>

<script>
'use strict';
/* 安全渲染:一切来自服务端/AI/用户的内容一律 textContent,禁止 innerHTML 拼接。 */
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = String(text);
  return e;
}
function card(cls) { return el('div', 'card' + (cls ? ' ' + cls : '')); }

/* ---------- URL 解析 ---------- */
const parts = location.pathname.split('/').filter(Boolean);  // /rt/<id>
const RID = parts[1];
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const API = '/api/review/' + RID;
const H = { 'Content-Type': 'application/json', 'X-Review-Token': TOKEN };

/* ---------- 主流程 ---------- */
let STATE = null;
const app = document.getElementById('app');

async function api(path, opts) {
  const r = await fetch(API + path, Object.assign({ headers: H }, opts));
  const j = await r.json().catch(() => ({ ok: false, error: '响应解析失败' }));
  if (!r.ok || j.ok === false) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

/* 右下角常驻状态条:当前版本 + 自动更新是否在工作 + 上次检查时间 */
const live = document.createElement('div');
live.id = 'live';
document.body.appendChild(live);
function setLive(rev, note) {
  const t = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  live.textContent = '当前版本 r' + rev + ' · ' + (note || '自动更新中') + ' · 上次检查 ' + t;
}

async function load() {
  try {
    STATE = await api('?t=' + encodeURIComponent(TOKEN));
    render();
  } catch (e) {
    app.replaceChildren(
      el('div', 'card', '无法加载审核任务:' + e.message),
      el('div', 'meta', '请确认链接完整(含 ?t= 令牌)且本地审核服务正在运行。'));
  }
}

function render() {
  const s = STATE;
  const frag = document.createDocumentFragment();
  setLive(s.current_revision);

  /* 页眉 */
  const head = el('div');
  const h1 = el('h1', '', s.title || '审核任务');
  const meta = el('div', 'meta');
  meta.append(el('span', 'pill ' + (s.status === 'confirmed' ? 'p-ok' : 'p-wait'),
                 s.status === 'confirmed' ? '✅ 你已确认 r' + s.current_revision : '⏳ 待你审核'),
              el('span', '', '  版本 r' + s.current_revision + ' · 任务 ' + s.review_id));
  head.append(h1, meta);
  frag.append(head);

  /* 差异横幅 */
  if (s.current_revision > 1) {
    const latest = s.revisions[s.revisions.length - 1];
    const b = el('div', 'banner');
    b.append(el('b', '', '📝 本次修改了什么(相对上一版,业务视角)'));
    const ul = el('ul');
    (latest.change_summary || []).forEach(t => ul.append(el('li', '', t)));
    b.append(ul);
    if ((latest.evidence || []).length) {
      const d = el('details'); const sum = el('summary', '', '修改依据(证据)');
      d.append(sum, el('pre', '', latest.evidence.join('\n'))); b.append(d);
    }
    frag.append(b);
  }

  /* 反馈状态提示(含已确认状态下的新意见) */
  const pend = s.feedback.filter(f => f.status === 'pending').length;
  if (pend > 0) {
    frag.append(el('div', 'banner', '⏳ 你有 ' + pend + ' 条意见已提交,等待 AI 读取并回应。AI 回应后会发布新版本,页面会自动展示变化' + (s.status === 'confirmed' ? ';你之前确认的版本若被修改,确认会自动失效。' : '。')));
  }

  /* 内容(按类型渲染) */
  frag.append(renderContent(s));

  /* 意见输入 */
  frag.append(renderComposer(s));

  /* 确认区 */
  frag.append(renderConfirm(s));

  /* 历史 */
  frag.append(renderHistory(s));

  app.replaceChildren(frag);
}

/* ---------- 内容渲染(requirement-review 类型专用,其他类型通用回退) ---------- */
function renderContent(s) {
  const box = el('div');
  const c = s.content || {};
  if (s.type === 'requirement-review') {
    if (c.restatement && c.restatement.one_liner) {
      box.append(el('h2', '', 'AI 对需求的理解(一句话)'));
      box.append(Object.assign(card('hl'), { textContent: c.restatement.one_liner }));
    }
    if (c.restatement) {
      const cc = card();
      if ((c.restatement.in_scope || []).length) {
        cc.append(el('span', 'tag t-green', '本次做'));
        c.restatement.in_scope.forEach(t => cc.append(el('div', '', '· ' + t)));
      }
      if ((c.restatement.out_of_scope || []).length) {
        cc.append(el('span', 'tag t-amber', '本次不做'));
        c.restatement.out_of_scope.forEach(t => cc.append(el('div', '', '· ' + t)));
      }
      if (cc.childNodes.length) box.append(cc);
    }
    if ((c.actors || []).length) {
      box.append(el('h2', '', '涉及的角色'));
      const row = el('div', 'row');
      c.actors.forEach(a => {
        const d = el('div', 'actor');
        d.append(el('b', '', a.name || a.id));
        if (a.goal) d.append(el('div', 'meta', '目标:' + a.goal));
        (a.journey || []).forEach(j => d.append(el('div', '', '→ ' + j)));
        row.append(d);
      });
      box.append(row);
    }
    if ((c.flows || []).length) {
      box.append(el('h2', '', '业务流程'));
      c.flows.forEach(fl => {
        const cc = card();
        cc.append(el('b', '', fl.name || fl.id));
        fl.steps.forEach(st => {
          const lane = el('div', 'lane');
          const who = st.actor === 'student' ? el('div', 'who ws', '学生')
                    : el('div', 'who wt', st.actor === 'teacher' ? '老师' : (st.actor || '?'));
          const stp = el('div', 'steps'); const d = el('div', 'step2');
          d.append(el('b', '', st.action || ''));
          if (st.exceptions && st.exceptions.length)
            d.append(el('div', '', '⚠ ' + st.exceptions.join(';')));
          stp.append(d); lane.append(who, stp); cc.append(lane);
        });
        box.append(cc);
      });
    }
    if ((c.open_questions || []).length) {
      box.append(el('h2', '', '需要你拍板的问题'));
      c.open_questions.forEach(q => {
        const d = el('div', 'q');
        d.append(el('b', '', q.question || q.id));
        if (q.context) d.append(el('div', 'meta', '背景:' + q.context));
        const opts = el('div', 'opts');
        (q.options || []).forEach(o => {
          const lb = el('label');
          const rb = el('input'); rb.type = 'radio';
          rb.name = 'q-' + q.id; rb.value = o.label;
          if (q.answer === o.label) rb.checked = true;
          lb.append(rb, document.createTextNode(' '));
          lb.append(o.recommended ? el('span', 'rec', o.label + '(推荐)') : document.createTextNode(o.label));
          opts.append(lb);
        });
        const other = el('label');
        const orb = el('input'); orb.type = 'radio'; orb.name = 'q-' + q.id; orb.value = '__other__';
        other.append(orb, document.createTextNode(' 其他/都不对,在下面写'));
        opts.append(other);
        const ta = el('textarea'); ta.placeholder = '针对此问题的补充(可留空)';
        ta.dataset.q = q.id;
        opts.append(ta);
        d.append(opts);
        box.append(d);
      });
    }
  } else {
    box.append(el('h2', '', '审核内容'));
    box.append(el('pre', '', JSON.stringify(c, null, 2)));
  }
  return box;
}

/* ---------- 意见输入 ---------- */
function renderComposer(s) {
  const box = el('div');
  box.append(el('h2', '', '你的意见(任意修改、建议、质疑)'));
  const cc = card();
  const ta = el('textarea'); ta.id = 'fb-text';
  ta.placeholder = '直接写。例如:"学生不是手动标记已学,是看完视频自动完成"';
  const sel = el('select'); sel.id = 'fb-step'; sel.style.marginTop = '8px';
  sel.append(el('option', '', '意见针对:整体'));
  const names = sectionNames(s);
  names.forEach((n, i) => { const o = el('option', '', '意见针对:第' + (i + 1) + '节 ' + n); o.value = i + 1; sel.append(o); });
  const btn = el('button', 'pri', '提交意见'); btn.style.marginTop = '8px';
  const msg = el('div', 'msg');
  btn.onclick = async () => {
    btn.disabled = true; msg.className = 'msg m-info'; msg.textContent = '提交中…';
    try {
      await api('/feedback?t=' + encodeURIComponent(TOKEN), {
        method: 'POST',
        body: JSON.stringify({ text: ta.value, step: sel.value ? +sel.value : null,
                               step_name: sel.value ? names[+sel.value - 1] : '' })
      });
      msg.className = 'msg m-ok';
      msg.textContent = '✅ 已提交,AI 会读取。修订完成后页面会展示变化(可离开,无需等待)。';
      ta.value = '';
      await load();
    } catch (e) {
      msg.className = 'msg m-err';
      msg.textContent = '提交失败:' + e.message + '(可直接重试;反复失败就把这段话发到对话里)';
      btn.disabled = false;
    }
  };
  cc.append(ta, sel, btn, msg);
  box.append(cc);
  return box;
}

function sectionNames(s) {
  if (s.type === 'requirement-review') {
    const c = s.content || {};
    const n = [];
    if (c.restatement) n.push('需求理解');
    if ((c.actors || []).length) n.push('角色');
    if ((c.flows || []).length) n.push('流程');
    if ((c.open_questions || []).length) n.push('待决问题');
    return n;
  }
  return [];
}

/* ---------- 确认 ---------- */
function renderConfirm(s) {
  const box = el('div');
  box.append(el('h2', '', '确认'));
  const cc = card();
  if (s.status === 'confirmed') {
    const last = (s.decisions || [])[s.decisions.length - 1];
    cc.append(el('div', '', '✅ 你已于 ' + (last ? last.time : '') + ' 确认 r' + (last ? last.revision : '')));
    cc.append(el('div', 'meta', '若 AI 之后修改了内容,确认会自动失效并回到待审核状态。'));
  } else {
    cc.append(el('div', '', '确认 = 这版需求成为后续架构设计与代码实现的对照基准。确认后仍可提新意见,但修改将重新进入审核。'));
    const btn = el('button', 'ok', '确认当前版本 r' + s.current_revision);
    const msg = el('div', 'msg');
    btn.onclick = async () => {
      btn.disabled = true; msg.className = 'msg m-info'; msg.textContent = '确认中…';
      try {
        await api('/confirm?t=' + encodeURIComponent(TOKEN), {
          method: 'POST', body: JSON.stringify({ ack_revision: s.current_revision })
        });
        msg.className = 'msg m-ok'; msg.textContent = '✅ 已确认 r' + s.current_revision + ',记录已保存。';
        await load();
      } catch (e) {
        msg.className = 'msg m-err'; msg.textContent = '确认失败:' + e.message + '(若提示版本过期请刷新页面)';
        await load();
      }
    };
    cc.append(btn, msg);
  }
  box.append(cc);
  return box;
}

/* ---------- 历史 ---------- */
function renderHistory(s) {
  const d = el('details');
  d.append(el('summary', '', '历史与追溯(版本 / 你的意见 / 确认记录)'));
  const line = (t) => el('div', 'fbitem', t);
  (s.revisions || []).forEach(r => d.append(line('r' + r.n + ' · ' + r.time + ' · AI 发布 · 变化:' + (r.change_summary || []).join(';'))));
  (s.feedback || []).forEach(f => {
    const st = f.status === 'pending' ? el('span', 'st st-pending', '待处理') : el('span', 'st st-addressed', '已在 r' + f.addressed_in + ' 回应');
    const item = el('div', 'fbitem');
    item.append(document.createTextNode('[' + f.time + '] ' + (f.step_name ? f.step_name + ': ' : '') + f.text));
    item.append(st);
    d.append(item);
  });
  (s.decisions || []).forEach(x => d.append(line('✅ ' + x.time + ' · 人工确认 r' + x.revision)));
  return d;
}

/* ---------- 短轮询:不用长连接,兼容浏览器代理环境(代理会掐断挂起请求) ---------- */
async function poll() {
  let fails = 0;
  while (true) {
    await new Promise(r => setTimeout(r, 6000));
    if (!STATE) continue;
    try {
      const s2 = await api('?t=' + encodeURIComponent(TOKEN));
      fails = 0;
      const changed =
        s2.current_revision !== STATE.current_revision ||
        (s2.feedback || []).length !== (STATE.feedback || []).length ||
        (s2.decisions || []).length !== (STATE.decisions || []).length;
      if (changed) { STATE = s2; render(); }
      else setLive(STATE.current_revision);
    } catch (e) {
      fails++;
      if (STATE) setLive(STATE.current_revision,
        fails >= 3 ? '⚠ 连接审核服务失败,将持续重试' : '自动更新中(网络重试 ' + fails + ')');
    }
  }
}

load();
poll();
</script>
</body>
</html>
